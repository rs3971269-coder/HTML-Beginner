<body>

    <div class="intro-section">

        <h4>About Me</h4>
        <p>
            I am a frontend <span class="highlight">developer</span> who loves building things!! lets rock

    </div>

    <div class="links-section">

    <!-- New: Sign Up Form -->
    <div class="form-section">
        <h2>Sign Up</h2>
        <form action="/submit" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required><br>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="name@example.com" required><br>

            <label for="password">Password</label>
            <input type="password" id="password" required><br>

            <button type="submit">Sign Up</button>
        </form>
    </div>

</body>
